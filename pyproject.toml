[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-search-course"
version = "0.1.0"
description = "Scaffold for a four-node distributed search engine course project"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=14,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Spark/Hadoop/Iceberg/API dependencies will be pinned after verifying VM compatibility.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
